[project]
name = "nouakchott-energy-forecasting"
version = "0.1.0"
description = "End-to-end electricity demand forecasting platform prototype for Nouakchott (synthetic/public data)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Bechir Mady" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "statsmodels>=0.14",
    "joblib>=1.3",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
mlops = [
    "mlflow>=2.14",
]
notebook = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbformat>=5.10",
]
dbt = [
    "dbt-postgres>=1.8",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "integration: tests that need a running PostgreSQL instance (skipped if unreachable)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "frontend", "dbt"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# N803/N806: allow ML / state-space notation (X, y, T, Z) as in scikit-learn and statsmodels.
ignore = ["E501", "N803", "N806"]

[tool.ruff.format]
quote-style = "double"
