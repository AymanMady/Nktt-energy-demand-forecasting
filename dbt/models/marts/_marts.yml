version: 2

models:
  - name: mart_energy_forecast
    description: >
      Model-ready hourly dataset: complete spine, weather, calendar, local flags and
      leakage-safe reference lags. SYNTHETIC data in the prototype (not SOMELEC data).
    columns:
      - name: timestamp
        data_tests: [not_null, unique]
      - name: demand_mw
        description: Target. Null only where the source has a gap (is_missing_demand).
      - name: is_missing_demand
        data_tests: [not_null]
      - name: hour
        data_tests: [not_null]
      - name: is_weekend
        data_tests: [not_null]
