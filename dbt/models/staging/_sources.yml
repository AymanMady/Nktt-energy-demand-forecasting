version: 2

sources:
  - name: raw
    description: Raw layer loaded by `python -m src.ingestion.load_data` (validated, canonical schema).
    schema: raw
    tables:
      - name: energy_demand
        description: Hourly demand + weather, one row per (source, timestamp).
        columns:
