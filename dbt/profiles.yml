# Connection settings come from environment variables (loaded from .env by `make dbt`).
# No credentials are stored in this file.
nouakchott_energy:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5440') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'energy') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'energy') }}"
      schema: analytics
      threads: 4
